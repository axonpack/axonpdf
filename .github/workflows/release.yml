name: Release

# Runs on every push to main. With changesets pending it opens or refreshes the Version Packages PR.
# Merging that PR leaves none, which publishes to npm, tags and creates the GitHub Releases. Any
# other push has nothing to publish. `workflow_dispatch` is the manual run.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a run mid-publish: a half-published release is worse than a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # Forks skip it, and a dispatch from another branch would publish that branch.
    if: github.repository == 'axonpack/axonpdf' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Trusted publishing: npm swaps this run's OIDC token for a short-lived publish token, so
      # there is no npm secret, and every release gets provenance with it.
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, and the npm bundled with Node 24 can be older.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-emscripten

      # build-wasm.sh needs exactly this Emscripten version.
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `version-packages` also refreshes the lockfile, which records each workspace's version.
      # `release` builds the WebAssembly module and the packages, then runs `changeset publish`.
      - name: Open the Version Packages PR, or publish
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: bun run version-packages
          publish-script: bun run release
          commit-message: "release: version packages"
          pr-title: "release: version packages"
          push-git-tags: true
          create-github-releases: true
