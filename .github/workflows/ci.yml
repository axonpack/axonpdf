name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, lint, types, tests
    # Forks skip it.
    if: github.repository == 'axonpack/axonpdf'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-emscripten

      # build-wasm.sh needs exactly this Emscripten version.
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The WebAssembly module is gitignored, and the core package's types and tests read it.
      - name: Build WebAssembly
        run: bun run build:wasm

      - name: Build packages
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Check types
        run: bun run check-types

      - name: Test
        run: bun run test
